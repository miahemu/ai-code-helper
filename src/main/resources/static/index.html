<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活问答 · RAG Demo</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f4f7fb; color: #182230; }
        .page { max-width: 1180px; margin: 0 auto; padding: 28px 20px 40px; }
        header { display: flex; justify-content: space-between; gap: 20px; align-items: center; margin-bottom: 22px; }
        h1 { margin: 0 0 6px; font-size: 27px; }
        .sub { color: #637083; font-size: 14px; }
        .status { padding: 10px 14px; border: 1px solid #d8e0ea; background: white; border-radius: 12px; color: #536174; font-size: 13px; }
        main { display: grid; grid-template-columns: 1.45fr 0.9fr; gap: 18px; }
        .card { background: white; border: 1px solid #e0e6ee; border-radius: 16px; box-shadow: 0 8px 28px rgba(28, 47, 76, .06); overflow: hidden; }
        .card-title { padding: 17px 20px; border-bottom: 1px solid #edf0f4; font-weight: 700; }
        .chat-list { height: 525px; padding: 20px; overflow: auto; }
        .message { max-width: 86%; margin-bottom: 16px; padding: 12px 15px; border-radius: 14px; line-height: 1.65; }
        .assistant { background: #f1f5fa; border-bottom-left-radius: 4px; }
        .user { margin-left: auto; background: #2775e8; color: white; border-bottom-right-radius: 4px; white-space: pre-wrap; }
        .md-paragraph + .md-paragraph { margin-top: 9px; }
        .md-heading { margin: 4px 0 8px; font-weight: 700; }
        .md-heading-1 { font-size: 20px; }
        .md-heading-2 { font-size: 17px; }
        .md-heading-3 { font-size: 15px; }
        .message ul, .message ol { margin: 7px 0; padding-left: 22px; }
        .message li + li { margin-top: 4px; }
        .message blockquote { margin: 8px 0; padding-left: 11px; border-left: 3px solid #aebdce; color: #58677a; }
        .message code { padding: 2px 5px; border-radius: 5px; background: #e2e8f0; font-family: Consolas, monospace; font-size: 13px; }
        .message pre { margin: 9px 0; padding: 11px; overflow: auto; border-radius: 8px; background: #182230; color: #edf3fa; white-space: pre-wrap; }
        .message pre code { padding: 0; background: transparent; color: inherit; }
        .refs { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #cbd5e1; font-size: 12px; color: #68768a; }
        .composer { display: flex; gap: 10px; padding: 15px; border-top: 1px solid #edf0f4; }
        textarea, input { width: 100%; border: 1px solid #cfd8e5; border-radius: 10px; padding: 11px 12px; font: inherit; outline: none; }
        textarea:focus, input:focus { border-color: #2775e8; box-shadow: 0 0 0 3px rgba(39, 117, 232, .1); }
        #question { min-height: 46px; max-height: 120px; resize: vertical; }
        button { border: 0; border-radius: 10px; padding: 0 18px; color: white; background: #2775e8; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .55; cursor: wait; }
        .knowledge { padding: 20px; }
        label { display: block; margin: 14px 0 7px; font-size: 13px; font-weight: 700; }
        #content { height: 165px; resize: vertical; line-height: 1.6; }
        .full { width: 100%; height: 43px; margin-top: 14px; }
        .result { min-height: 22px; margin-top: 12px; color: #2775e8; font-size: 13px; }
        .divider { height: 1px; margin: 20px 0; background: #edf0f4; }
        .section-title { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 700; }
        .link-button { padding: 5px 0; color: #2775e8; background: transparent; font-size: 13px; }
        .document-list { max-height: 245px; margin-top: 10px; overflow: auto; }
        .document-empty { padding: 20px 0; color: #8490a1; text-align: center; font-size: 13px; }
        .document-item { padding: 12px 0; border-bottom: 1px solid #edf0f4; }
        .document-name { overflow: hidden; font-size: 14px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
        .document-meta { margin-top: 5px; color: #78869a; font-size: 12px; }
        .document-actions { display: flex; gap: 8px; margin-top: 9px; }
        .document-actions button { padding: 6px 10px; border: 1px solid #cfd8e5; color: #536174; background: white; font-size: 12px; }
        .document-actions .danger { border-color: #f2c5c5; color: #c13b3b; }
        @media (max-width: 820px) { main { grid-template-columns: 1fr; } header { align-items: flex-start; flex-direction: column; } }
    </style>
</head>
<body>
<div class="page">
    <header>
        <div>
            <h1>生活问答 · RAG Demo</h1>
            <div class="sub">先导入文章，再提问；模型和 Elasticsearch 都可以逐步接入。</div>
        </div>
        <div id="status" class="status">正在读取运行模式…</div>
    </header>
    <main>
        <section class="card">
            <div class="card-title">对话</div>
            <div id="chatList" class="chat-list">
                <div class="message assistant">你好！可以先在右侧导入一篇做饭、旅行、养宠物或生活常识文章，然后问我相关问题。</div>
            </div>
            <div class="composer">
                <textarea id="question" placeholder="例如：下雨天衣服晾不干怎么办？"></textarea>
                <button id="askBtn" onclick="ask()">发送</button>
            </div>
        </section>
        <section class="card">
            <div class="card-title">导入知识</div>
            <div class="knowledge">
                <label for="title">文章标题</label>
                <input id="title" value="雨天晾衣小技巧">
                <label for="content">文章内容</label>
                <textarea id="content">连续下雨时，衣服应尽量拉开间距，并放在空气流动的位置。可以用风扇对着衣物吹，加快水分蒸发；空调开启除湿模式也有帮助。厚衣服可把衣架两端撑开，让衣服内部形成通风空间。衣服完全干燥后再收进衣柜，避免产生霉味。</textarea>
                <button id="importBtn" class="full" onclick="importKnowledge()">切分并写入知识库</button>
                <label for="file">上传文档</label>
                <input id="file" type="file" accept=".txt,.md,.pdf,.doc,.docx">
                <button id="uploadBtn" class="full" onclick="uploadDocument()">解析并写入知识库</button>
                <div id="importResult" class="result"></div>
                <div class="divider"></div>
                <div class="section-title">
                    <span>文档管理</span>
                    <button class="link-button" onclick="loadDocuments()">刷新</button>
                </div>
                <div id="documentList" class="document-list">
                    <div class="document-empty">正在读取文档…</div>
                </div>
            </div>
        </section>
    </main>
</div>
<script>
    async function request(url, options) {
        const response = await fetch(url, options);
        const result = await response.json();
        if (result.code !== 0) throw new Error(result.message || '请求失败');
        return result.data;
    }

    function appendInlineMarkdown(container, text) {
        const pattern = /(\*\*[^*\n]+\*\*|`[^`\n]+`|\*[^*\n]+\*)/g;
        let lastIndex = 0;
        let match;
        while ((match = pattern.exec(text)) !== null) {
            container.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
            const token = match[0];
            const element = document.createElement(token.startsWith('`') ? 'code' : token.startsWith('**') ? 'strong' : 'em');
            element.textContent = token.startsWith('**') ? token.slice(2, -2) : token.slice(1, -1);
            container.appendChild(element);
            lastIndex = pattern.lastIndex;
        }
        container.appendChild(document.createTextNode(text.substring(lastIndex)));
    }

    function renderMarkdown(container, markdown) {
        const content = String(markdown || '')
                .replace(/\r\n/g, '\n')
                .replace(/\\([*_`#>-])/g, '$1')
                .replace(/\*{3,}/g, '**');
        const lines = content.split('\n');
        let list = null;
        let listType = '';
        let paragraph = [];
        let codeLines = [];
        let inCodeBlock = false;

        function flushParagraph() {
            if (!paragraph.length) return;
            const element = document.createElement('div');
            element.className = 'md-paragraph';
            appendInlineMarkdown(element, paragraph.join('\n'));
            container.appendChild(element);
            paragraph = [];
        }

        function closeList() {
            list = null;
            listType = '';
        }

        lines.forEach(line => {
            if (line.trim().startsWith('```')) {
                flushParagraph();
                closeList();
                if (inCodeBlock) {
                    const pre = document.createElement('pre');
                    const code = document.createElement('code');
                    code.textContent = codeLines.join('\n');
                    pre.appendChild(code);
                    container.appendChild(pre);
                    codeLines = [];
                }
                inCodeBlock = !inCodeBlock;
                return;
            }
            if (inCodeBlock) {
                codeLines.push(line);
                return;
            }
            if (!line.trim()) {
                flushParagraph();
                closeList();
                return;
            }

            const heading = line.match(/^(#{1,3})\s+(.+)$/);
            if (heading) {
                flushParagraph();
                closeList();
                const element = document.createElement('div');
                element.className = `md-heading md-heading-${heading[1].length}`;
                appendInlineMarkdown(element, heading[2]);
                container.appendChild(element);
                return;
            }

            const unorderedItem = line.match(/^[-*+]\s+(.+)$/);
            const orderedItem = line.match(/^\d+\.\s+(.+)$/);
            if (unorderedItem || orderedItem) {
                flushParagraph();
                const currentType = orderedItem ? 'ol' : 'ul';
                if (!list || listType !== currentType) {
                    closeList();
                    list = document.createElement(currentType);
                    listType = currentType;
                    container.appendChild(list);
                }
                const item = document.createElement('li');
                appendInlineMarkdown(item, (orderedItem || unorderedItem)[1]);
                list.appendChild(item);
                return;
            }

            const quote = line.match(/^>\s?(.*)$/);
            if (quote) {
                flushParagraph();
                closeList();
                const element = document.createElement('blockquote');
                appendInlineMarkdown(element, quote[1]);
                container.appendChild(element);
                return;
            }

            closeList();
            paragraph.push(line);
        });
        flushParagraph();
        if (inCodeBlock && codeLines.length) {
            const pre = document.createElement('pre');
            const code = document.createElement('code');
            code.textContent = codeLines.join('\n');
            pre.appendChild(code);
            container.appendChild(pre);
        }
    }

    function appendMessage(type, text, references) {
        const item = document.createElement('div');
        item.className = 'message ' + type;
        if (type === 'assistant') {
            renderMarkdown(item, text);
        } else {
            item.textContent = text;
        }
        if (references && references.length) {
            const refs = document.createElement('div');
            refs.className = 'refs';
            refs.textContent = '引用：' + references.map(item => `${item.title} #${item.chunkIndex + 1}（相似度 ${item.score.toFixed(3)}）`).join('；');
            item.appendChild(refs);
        }
        const list = document.getElementById('chatList');
        list.appendChild(item);
        list.scrollTop = list.scrollHeight;
    }

    async function ask() {
        const question = document.getElementById('question').value.trim();
        if (!question) return;
        appendMessage('user', question);
        document.getElementById('question').value = '';
        const button = document.getElementById('askBtn');
        button.disabled = true;
        try {
            const data = await request('/api/chat/ask', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question, topK: 4})
            });
            appendMessage('assistant', data.answer, data.references);
        } catch (error) {
            appendMessage('assistant', '请求失败：' + error.message);
        } finally {
            button.disabled = false;
        }
    }

    async function importKnowledge() {
        const title = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();
        const button = document.getElementById('importBtn');
        button.disabled = true;
        try {
            const data = await request('/api/knowledge/import', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title, content})
            });
            document.getElementById('importResult').textContent = `导入成功：${data.chunkCount} 个切片，${data.embeddingMode} / ${data.vectorStoreMode}`;
            await loadDocuments();
        } catch (error) {
            document.getElementById('importResult').textContent = '导入失败：' + error.message;
        } finally {
            button.disabled = false;
        }
    }

    async function uploadDocument() {
        const fileInput = document.getElementById('file');
        if (!fileInput.files.length) {
            document.getElementById('importResult').textContent = '请先选择文档';
            return;
        }
        const button = document.getElementById('uploadBtn');
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        button.disabled = true;
        try {
            const data = await request('/api/knowledge/upload', {method: 'POST', body: formData});
            document.getElementById('importResult').textContent = `上传成功：${data.chunkCount} 个切片，${data.embeddingMode} / ${data.vectorStoreMode}`;
            fileInput.value = '';
            await loadDocuments();
        } catch (error) {
            document.getElementById('importResult').textContent = '上传失败：' + error.message;
        } finally {
            button.disabled = false;
        }
    }

    function createActionButton(text, className, handler) {
        const button = document.createElement('button');
        button.textContent = text;
        if (className) button.className = className;
        button.addEventListener('click', handler);
        return button;
    }

    async function loadDocuments() {
        const list = document.getElementById('documentList');
        try {
            const documents = await request('/api/knowledge/documents');
            list.replaceChildren();
            if (!documents.length) {
                const empty = document.createElement('div');
                empty.className = 'document-empty';
                empty.textContent = '暂无已导入文档';
                list.appendChild(empty);
                return;
            }
            documents.forEach(documentInfo => {
                const item = document.createElement('div');
                item.className = 'document-item';

                const name = document.createElement('div');
                name.className = 'document-name';
                name.textContent = documentInfo.title;

                const meta = document.createElement('div');
                meta.className = 'document-meta';
                const updateTime = documentInfo.updateTime ? new Date(documentInfo.updateTime).toLocaleString() : '-';
                meta.textContent = `${documentInfo.documentType.toUpperCase()} · ${documentInfo.chunkCount} 个切片 · ${updateTime}`;

                const actions = document.createElement('div');
                actions.className = 'document-actions';
                actions.appendChild(createActionButton('重新索引', '', () => reindexDocument(documentInfo.documentId)));
                actions.appendChild(createActionButton('删除', 'danger', () => deleteDocument(documentInfo.documentId, documentInfo.title)));

                item.append(name, meta, actions);
                list.appendChild(item);
            });
        } catch (error) {
            list.replaceChildren();
            const empty = document.createElement('div');
            empty.className = 'document-empty';
            empty.textContent = '文档读取失败：' + error.message;
            list.appendChild(empty);
        }
    }

    async function reindexDocument(documentId) {
        try {
            const data = await request(`/api/knowledge/documents/${encodeURIComponent(documentId)}/reindex`, {method: 'POST'});
            document.getElementById('importResult').textContent = `重新索引成功：${data.chunkCount} 个切片`;
            await loadDocuments();
        } catch (error) {
            document.getElementById('importResult').textContent = '重新索引失败：' + error.message;
        }
    }

    async function deleteDocument(documentId, title) {
        if (!window.confirm(`确认删除“${title}”及其全部切片吗？`)) return;
        try {
            await request(`/api/knowledge/documents/${encodeURIComponent(documentId)}`, {method: 'DELETE'});
            document.getElementById('importResult').textContent = '文档删除成功';
            await loadDocuments();
        } catch (error) {
            document.getElementById('importResult').textContent = '删除失败：' + error.message;
        }
    }

    document.getElementById('question').addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); ask(); }
    });

    request('/api/knowledge/status').then(data => {
        document.getElementById('status').textContent = `向量：${data.embeddingMode} ｜ 存储：${data.vectorStoreMode}`;
    }).catch(() => document.getElementById('status').textContent = '状态读取失败');
    loadDocuments();
</script>
</body>
</html>
