server:
  port: 3859

spring:
  application:
    name: ai-code-helper
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

ai:
  chat:
    # DeepSeek API 官方文档：https://api-docs.deepseek.com/
    base_url: "xxxxxxxx"
    api-key: "xxxxxxxxx"
    model: "DeepSeek-V4-Pro"
  chat-memory:
    # 每个 conversationId 最多保留的消息数量，包含用户、助手和工具消息
    max-messages: 20
  embedding:
    # OpenAI 兼容的 embeddings 完整地址；留空时使用本地 256 维哈希向量
    url: ""
    api-key: ""
    model: ""
    dimensions: 256
  chunk:
    # 文档切片大小
    size: 500
    # 相邻文档切片重叠长度
    overlap: 80
  retrieval:
    # 低于该相似度的切片不参与回答，也不会在页面展示
    min-score: 0.50
    # 本地哈希向量缺少语义能力，额外要求问题与切片存在真实关键词重合
    local-keyword-filter-enabled: true

agent:
  # LangChain4j 单次任务允许的最大工具调用轮数，避免异常情况下无限循环
  max-steps: 5
  # 是否记录 Agent 执行结果和工具调用数量
  trace-enabled: true

bigmodel:
  # GLM Coding Plan 专属 API Key
  # Token plan：https://bigmodel.cn/coding-plan/personal/overview
  # 余额总览：https://bigmodel.cn/finance-center/finance/overview
  # 本地启动 MCP 服务: https://mcp.so/servers/cc-zhipu-web-search
  # 远程 MCP 服务: https://docs.bigmodel.cn/cn/coding-plan/mcp/search-mcp-server
  api-key: "xxxxxxxxxxx"
  mcp:
    web-search-url: "https://open.bigmodel.cn/api/mcp/web_search_prime/mcp"
    # 调试时可开启 MCP 请求和响应日志
    log-enabled: false

elasticsearch:
  # 首次启动建议保持 false，跑通后再改为 true 接测试线 ES
  enabled: false
  # Elasticsearch 服务地址
  url: "http://localhost:9200"
  # Elasticsearch 用户名和密码；未开启认证时保持为空
  username: ""
  password: ""
  # 知识库向量索引名称
  index-name: "ai_knowledge_chunk"
