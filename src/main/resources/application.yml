server:
  port: 3859

spring:
  application:
    name: ai-rag-demo
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

http:
  connect-timeout: 10000
  read-timeout: 60000

ai:
  chat:
    # OpenAI 兼容的 Chat Completions 完整地址
    url: "xxxxxxxx"
    api-key: "xxxxxxxxx"
    model: "DeepSeek-V4-Pro"
  embedding:
    # OpenAI 兼容的 embeddings 完整地址；留空时使用本地 256 维哈希向量
    url: ""
    api-key: ""
    model: ""
    dimensions: 256
  chunk:
    # 文档切片大小
    size: 500
    # 相邻文档切片重叠长度
    overlap: 80
  retrieval:
    # 低于该相似度的切片不参与回答，也不会在页面展示
    min-score: 0.20
    # 本地哈希向量缺少语义能力，额外要求问题与切片存在真实关键词重合
    local-keyword-filter-enabled: true

agent:
  # true： 新Agent流程
  # false： 固定 RAG 流程
  enabled: true
  # 单次任务允许的最大模型调用轮数，避免异常情况下无限循环
  max-steps: 5
  # 是否记录 Agent 执行轨迹，当前仅预留配置
  trace-enabled: true

elasticsearch:
  # 首次启动建议保持 false，跑通后再改为 true 接测试线 ES
  enabled: false
  # Elasticsearch 服务地址
  url: "http://localhost:9200"
  # Elasticsearch 用户名和密码；未开启认证时保持为空
  username: ""
  password: ""
  # 知识库向量索引名称
  index-name: "ai_knowledge_chunk"
