<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Diving 智能助手，支持通用问答、知识库检索与智能工具">
    <title>Diving 智能助手</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260911-3">
    <link rel="stylesheet" href="/css/index.css?v=20260914-11">
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">
                <img src="/favicon.svg?v=20260911-3" alt="" aria-hidden="true">
            </div>
            <div>
                <h1>Diving 智能助手</h1>
                <p>通用问答、知识库检索与智能工具</p>
            </div>
        </div>
        <div class="system-status" aria-label="系统运行状态">
            <span class="status-dot"></span>
            <span id="status">正在读取服务状态…</span>
        </div>
    </header>

    <main class="workspace">
        <section class="panel chat-panel">
            <div class="panel-header chat-header">
                <div>
                    <div class="panel-title">智能对话</div>
                    <div class="panel-subtitle">可直接提问，需要时会自动检索已导入的资料</div>
                </div>
                <div class="chat-tools">
                    <label class="stream-mode-field" for="streamMode"
                           title="关闭后将等待完整回答生成完成，再一次性展示结果">
                        <input id="streamMode" type="checkbox" checked>
                        <span class="stream-mode-switch" aria-hidden="true"></span>
                        <span>流式输出</span>
                    </label>
                    <label class="top-k-field" for="topK">
                        <span>最多参考</span>
                        <select id="topK" aria-label="每次回答参考的知识库片段数量">
                            <option value="3">3</option>
                            <option value="4" selected>4</option>
                            <option value="6">6</option>
                            <option value="8">8</option>
                        </select>
                        <span>段资料</span>
                        <span class="top-k-help" tabindex="0"
                              title="数量越大，参考的知识库内容越多，回答覆盖更广，但也可能混入不太相关的信息。"
                              aria-label="数量越大，参考范围越广，但也可能混入不太相关的信息">?</span>
                    </label>
                    <button id="clearChatBtn" class="ghost-button" type="button">清空对话</button>
                </div>
            </div>

            <div id="chatList" class="chat-list" aria-live="polite"></div>

            <div class="composer">
                <textarea id="question" rows="1" maxlength="2000"
                          placeholder="向 Diving 提问，Enter 发送，Shift + Enter 换行"></textarea>
                <div class="composer-footer">
                    <span id="questionCount" class="character-count">0 / 2000</span>
                    <div class="composer-actions">
                        <button id="stopBtn" class="stop-button" type="button" aria-label="停止生成" hidden>
                            <svg aria-hidden="true" viewBox="0 0 24 24">
                                <rect x="7" y="7" width="10" height="10" rx="1"></rect>
                            </svg>
                        </button>
                        <div id="askButtonWrapper" class="send-button-wrapper">
                            <button id="askBtn" class="send-button" type="button" aria-label="发送问题" disabled>
                                <svg aria-hidden="true" viewBox="0 0 24 24">
                                    <path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"></path>
                                </svg>
                            </button>
                            <span id="askButtonTip" class="send-button-tooltip" role="tooltip">请输入你的问题</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <aside class="panel knowledge-panel">
            <div class="panel-header">
                <div>
                    <div class="panel-title">知识库管理</div>
                    <div class="panel-subtitle">导入资料并管理索引状态</div>
                </div>
                <span id="documentCount" class="count-badge">0 篇</span>
            </div>

            <div class="knowledge-content">
                <div class="tabs" role="tablist" aria-label="知识导入方式">
                    <button class="tab-button active" type="button" role="tab"
                            aria-selected="true" data-tab="textImport">粘贴文本</button>
                    <button class="tab-button" type="button" role="tab"
                            aria-selected="false" data-tab="fileImport">上传文档</button>
                </div>

                <section id="textImport" class="tab-content active" role="tabpanel">
                    <label for="title">文档标题</label>
                    <input id="title" maxlength="200" placeholder="例如：贵金属交易规则">

                    <div class="field-heading">
                        <label for="content">文档内容</label>
                        <span id="contentCount" class="character-count">0 字</span>
                    </div>
                    <textarea id="content" maxlength="100000"
                              placeholder="粘贴需要检索的业务资料、产品说明或常见问题…"></textarea>
                    <button id="importBtn" class="primary-button full-button" type="button">导入并建立索引</button>
                </section>

                <section id="fileImport" class="tab-content" role="tabpanel" hidden>
                    <input id="file" class="file-input" type="file" accept=".txt,.md,.pdf,.doc,.docx">
                    <label id="dropZone" class="drop-zone" for="file">
                        <span class="upload-icon" aria-hidden="true">↑</span>
                        <strong>点击选择或拖放文档</strong>
                        <span>支持 TXT、MD、PDF、DOC、DOCX，最大 10 MB</span>
                    </label>
                    <div id="selectedFile" class="selected-file" hidden></div>
                    <button id="uploadBtn" class="primary-button full-button" type="button">上传并建立索引</button>
                </section>

                <div id="operationMessage" class="operation-message" aria-live="polite"></div>

                <div class="document-section">
                    <div class="document-heading">
                        <span>已导入文档</span>
                        <button id="refreshDocumentsBtn" class="icon-button" type="button" title="刷新文档列表"
                                aria-label="刷新文档列表">↻</button>
                    </div>
                    <div class="search-box">
                        <span aria-hidden="true">⌕</span>
                        <input id="documentSearch" type="search" placeholder="搜索文档名称">
                    </div>
                    <div id="documentList" class="document-list">
                        <div class="empty-state compact">正在读取文档…</div>
                    </div>
                </div>
            </div>
        </aside>
    </main>
</div>

<div id="contentViewer" class="content-viewer" hidden>
    <button id="contentViewerBackdrop" class="content-viewer-backdrop" type="button"
            aria-label="关闭内容查看"></button>
    <section class="content-viewer-dialog" role="dialog" aria-modal="true" aria-labelledby="contentViewerTitle">
        <header class="content-viewer-header">
            <div>
                <div id="contentViewerType" class="content-viewer-type">文档原文</div>
                <h2 id="contentViewerTitle"></h2>
                <div id="contentViewerMeta" class="content-viewer-meta"></div>
            </div>
            <button id="contentViewerClose" class="content-viewer-close" type="button" aria-label="关闭">×</button>
        </header>
        <div id="contentViewerBody" class="content-viewer-body"></div>
    </section>
</div>

<div id="deleteDialog" class="delete-dialog" hidden>
    <button id="deleteDialogBackdrop" class="delete-dialog-backdrop" type="button"
            aria-label="取消删除"></button>
    <section class="delete-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="deleteDialogTitle"
             aria-describedby="deleteDialogDescription">
        <button id="deleteDialogClose" class="delete-dialog-close" type="button" aria-label="关闭">×</button>
        <div class="delete-dialog-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <path d="M12 8v5"></path>
                <path d="M12 17h.01"></path>
                <path d="M10.3 3.8 2.2 18a2 2 0 0 0 1.7 3h16.2a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0Z"></path>
            </svg>
        </div>
        <h2 id="deleteDialogTitle">删除文档？</h2>
        <p id="deleteDialogDescription">删除后将无法恢复。</p>
        <div class="delete-dialog-target">
            <span id="deleteDialogDocumentName" class="delete-dialog-document-name"></span>
            <span id="deleteDialogDocumentMeta" class="delete-dialog-document-meta"></span>
        </div>
        <div class="delete-dialog-actions">
            <button id="deleteDialogCancel" class="dialog-button secondary" type="button">取消</button>
            <button id="deleteDialogConfirm" class="dialog-button danger" type="button">确认删除</button>
        </div>
    </section>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="/js/app.js?v=20260914-3"></script>
</body>
</html>
